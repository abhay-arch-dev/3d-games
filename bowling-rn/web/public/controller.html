<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>Bowling Controller</title>
<style>
  :root {
    --bg: #0d1220; --panel: #161d31; --line: #26304d; --text: #eef2ff; --dim: #8b95b5;
    --accent: #ff7a2f; --accent2: #ffb03a; --ok: #3ddc97; --bad: #ff5d6c;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, Roboto, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); gap: 12px;
    user-select: none; -webkit-user-select: none; touch-action: none; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .status { display: flex; gap: 8px; font-size: 13px; color: var(--dim); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); margin-right: 5px; vertical-align: 1px; }
  .dot.on { background: var(--ok); }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: none; color: var(--dim); font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 7px; }
  .seg button.on { background: var(--line); color: var(--text); }
  .score { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .score b { font-size: 26px; font-variant-numeric: tabular-nums; }
  .score small { color: var(--dim); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .pos { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
  .pos .row small { color: var(--dim); font-size: 12px; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 8px 0 2px; height: 28px; }
  label.chk { font-size: 13px; color: var(--dim); display: flex; gap: 6px; align-items: center; }
  #pad { flex: 1; min-height: 220px; border-radius: 24px; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #2a1c14 0%, #161d31 70%); border: 1px solid var(--line);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; }
  #pad .ring { width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle at 35% 30%, var(--accent2), var(--accent) 60%, #b8471a);
    box-shadow: 0 10px 40px rgba(255,122,47,.35); transition: transform .12s, box-shadow .12s; }
  #pad .ring span { font-weight: 800; font-size: 20px; letter-spacing: .08em; color: #2a1206; }
  #pad.holding .ring { transform: scale(.92); box-shadow: 0 0 0 10px rgba(255,176,58,.25), 0 0 60px rgba(255,122,47,.7); }
  #pad.disabled { opacity: .45; }
  #pad.disabled .ring { filter: grayscale(.8); }
  #pad .hint { color: var(--dim); font-size: 14px; max-width: 280px; }
  #pad canvas { position: absolute; inset: 0; pointer-events: none; }
  .foot { display: flex; gap: 10px; }
  .foot button { flex: 1; background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px; font: inherit; font-weight: 600; }
  #last { color: var(--dim); font-size: 13px; text-align: center; min-height: 18px; }
  #warn { display: none; background: #3a1a20; border: 1px solid #6b2a35; color: #ffc3ca; border-radius: 12px; padding: 10px 12px; font-size: 13px; }
  /* Landscape: controls on the left, throw pad on the right. */
  body { display: grid; grid-template-columns: minmax(240px, 42%) 1fr; grid-template-rows: auto auto auto auto 1fr auto;
    grid-auto-flow: column; column-gap: 16px; row-gap: 8px; padding: 10px max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); }
  body > .row, #warn, .score, .pos, #last, .foot { grid-column: 1; }
  #pad { grid-column: 2; grid-row: 1 / -1; min-height: 0; }
  .score, .pos { padding: 8px 12px; }
  .foot { align-self: end; }
  #pad .ring { width: min(170px, 42vh); height: min(170px, 42vh); }
  #rotate { display: none; }
  @media (orientation: portrait) {
    #rotate { display: grid; position: fixed; inset: 0; z-index: 9; place-items: center; background: var(--bg); font-size: 20px; text-align: center; padding: 24px; }
  }
  /* Bowling-only controls are hidden in the other games. */
  body:not([data-game="bowling"]) #players { display: none; }
  body[data-game="runner"] .pos, body[data-game="dance"] .pos, body[data-game="hub"] .pos,
  body[data-game="runner"] .score, body[data-game="dance"] .score, body[data-game="hub"] .score,
  body[data-game="runner"] #warn, body[data-game="dance"] #warn, body[data-game="hub"] #warn,
  body[data-game="runner"] #mode, body[data-game="dance"] #mode, body[data-game="hub"] #mode { display: none; }
  #toast { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) scale(.9); opacity: 0;
    background: rgba(13,18,32,.92); border: 1px solid var(--line); padding: 16px 22px; border-radius: 16px;
    font-size: 26px; font-weight: 800; pointer-events: none; transition: opacity .2s, transform .2s; text-align: center; }
  #toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
</style>
</head>
<body>
  <div class="row">
    <div class="status">
      <span><i class="dot" id="dServer"></i>Server</span>
      <span><i class="dot" id="dTv"></i>TV</span>
    </div>
    <span id="gameName" class="status" style="color:var(--text);font-weight:700"></span>
    <div class="seg" id="mode">
      <button data-mode="motion" class="on">Motion</button>
      <button data-mode="swipe">Swipe</button>
    </div>
  </div>

  <div id="warn"></div>

  <div class="score row">
    <div><small id="frameLbl">Frame 1 · Ball 1</small><b id="total">0</b></div>
    <div style="text-align:right"><small>Speed</small><b id="speed" style="font-size:20px">–</b></div>
  </div>

  <div class="pos">
    <div class="row"><small>Starting position</small>
      <label class="chk"><input type="checkbox" id="tilt" checked> Tilt phone to move</label></div>
    <input type="range" id="posRange" min="-100" max="100" value="0">
  </div>

  <div id="pad">
    <canvas id="trail"></canvas>
    <div class="ring"><span id="padLbl">HOLD</span></div>
    <div class="hint" id="hint">Hold the button, swing your arm forward like a bowler, and let go to throw.</div>
  </div>

  <div id="last"></div>
  <div class="foot">
    <div class="seg" id="players"><button data-n="1">1P</button><button data-n="2">2P</button></div>
    <button id="newGame">New game</button>
  </div>
  <div id="toast"></div>
  <div id="rotate">📱↻<br>Turn your phone sideways</div>

<script src="controller.js"></script>
</body>
</html>
